name: Investor Desk

on:
  schedule:
    # Once a day after the US market closes (21:00/22:00 SAST). GitHub often starts schedules late,
    # so there are backups; each one skips if today's report already exists.
    - cron: '23 22 * * 1-5'    # 00:23 SAST Tue-Sat
    - cron: '53 23 * * 1-5'    # 01:53 SAST
    - cron: '37 1 * * 2-6'     # 03:37 SAST
    - cron: '11 9 * * 6'       # Saturday 11:11 SAST weekly catch-up
  workflow_dispatch:           # "Run workflow" button for an on-demand report

permissions:
  contents: write
  pages: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect prices, economy, company accounts and news; score ideas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INV_AUTO: ${{ github.event_name == 'schedule' }}
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python scripts/investor.py
      - name: Save the report
        run: |
          git config user.name "bias-desk-bot"
          git config user.email "bias-desk-bot@users.noreply.github.com"
          git add investor.json investor_history.json investor_fundamentals.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Investor Desk report $(TZ=Africa/Johannesburg date +%F)"
          git pull --rebase
          git push
      - name: Refresh the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages refresh request skipped"
