name: Daily bias scores

on:
  schedule:
    # GitHub often starts scheduled runs late (hours, on busy days) or skips them, so there are
    # several backups. Each one skips if today's scores already exist, so only the first one scores.
    - cron: '7 2 * * *'    # 04:07 SAST
    - cron: '41 2 * * *'   # 04:41 SAST
    - cron: '13 3 * * *'   # 05:13 SAST
    - cron: '47 3 * * *'   # 05:47 SAST
    - cron: '23 4 * * *'   # 06:23 SAST
    - cron: '17 5 * * *'   # 07:17 SAST
    - cron: '37 6 * * *'   # 08:37 SAST
  workflow_dispatch:        # "Run workflow" button for an on-demand update
    inputs:
      auto:
        description: 'Started by the website - skip if today already has scores'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect news and score every pair
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BD_AUTO: ${{ inputs.auto }}
        run: python scripts/score.py
      - name: Save scores.json and history
        run: |
          git config user.name "bias-desk-bot"
          git config user.email "bias-desk-bot@users.noreply.github.com"
          git add scores.json scores_history.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Daily bias scores $(TZ=Africa/Johannesburg date +%F)"
          git pull --rebase
          git push
      - name: Refresh the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages refresh request skipped"
