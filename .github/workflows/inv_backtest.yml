name: Investor backtest (weekly)

# Phase 2: re-runs the swing-signal backtests every Saturday on the latest data and saves
# investor_signal_stats.json + backtest.md to the invest-data branch. Signals only go "live" if they pass the gate.
on:
  schedule:
    - cron: '17 6 * * 6'   # Saturday 08:17 SAST
  workflow_dispatch:
  push:
    branches: ['invest/**']
    paths: ['scripts/inv_backtest.py', '.github/workflows/inv_backtest.yml']

permissions:
  contents: write

concurrency:
  group: invest-data
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: invest-data, path: cache }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy==2.*
      - name: Backtest
        env: { PYTHONUNBUFFERED: '1' }
        run: python scripts/inv_backtest.py --cache cache --out cache/reports
      - name: Save results
        working-directory: cache
        run: |
          git config user.name "bias-desk-bot"
          git config user.email "bias-desk-bot@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Investor backtest $(TZ=Africa/Johannesburg date '+%F %H:%M')"
          git pull --rebase && git push
      - run: cat cache/reports/backtest.md >> "$GITHUB_STEP_SUMMARY"
