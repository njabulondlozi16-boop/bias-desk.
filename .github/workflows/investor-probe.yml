name: Investor data source probe
on:
  push:
    branches: ['invest/**']
    paths: ['scripts/inv_probe.py', '.github/workflows/investor-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/inv_probe.py
