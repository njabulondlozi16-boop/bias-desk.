name: tmp deriv symbol check
on:
  push:
    branches: [tmp-deriv-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: pip install websocket-client -q
      - shell: python
        run: |
          import json, websocket
          def ask(url, payloads):
              out = []
              try:
                  ws = websocket.create_connection(url, timeout=20)
                  for p in payloads:
                      ws.send(json.dumps(p)); out.append(json.loads(ws.recv()))
                  ws.close()
              except Exception as e:
                  out.append({"connect_error": str(e)})
              return out
          url = "wss://api.derivws.com/trading/v1/options/ws/public"
          probes = [{"ticks_history": c, "end": "latest", "count": 3, "style": "candles", "granularity": 60} for c in ("BOOM100", "R_25", "R_75")]
          for p, r in zip(probes, ask(url, probes)):
              c = r.get("candles") or []
              print("probe", p["ticks_history"], "->", (r.get("error") or {}).get("message") or f"{len(c)} candles, last close {c[-1].get('close') if c else None}")
